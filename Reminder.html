<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#593A3B">

    <title>Reminders - Blank Space</title>

    <style>
        /* =========================
           COLORS AND RESET
        ========================= */

        :root {
            color-scheme: light;

            --background: #F4E8E6;
            --card: #FFF9F7;
            --text: #593A3B;
            --muted: #806B6B;
            --accent: #B86F72;
            --accent-hover: #9F5D61;
            --light-rose: #D9A6A6;
            --border: #D8C2C1;
            --header: #593A3B;
            --header-text: #FFF9F7;
            --input-background: #F4E8E6;
            --shadow: #593A3B14;
            --overlay: #00000066;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;

            background: var(--background);
            color: var(--text);

            font-family: Arial, sans-serif;

            transition:
                background-color 0.25s,
                color 0.25s;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        /* =========================
           DARK MODE

           Uses the same darkMode
           localStorage setting as
           the other Blank Space pages.
        ========================= */

        body.dark-mode {
            color-scheme: dark;

            --background: #3A3536;
            --card: #494041;
            --text: #F4E8E6;
            --muted: #C5B5B3;
            --accent: #D9A6A6;
            --accent-hover: #E7BBBB;
            --light-rose: #B86F72;
            --border: #625354;
            --header: #292627;
            --header-text: #F4E8E6;
            --input-background: #302B2C;
            --shadow: #00000030;
            --overlay: #00000099;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            min-height: 68px;

            background: var(--header);
            color: var(--header-text);

            display: flex;
            align-items: center;

            padding:
                max(10px, env(safe-area-inset-top))
                18px
                10px;

            gap: 14px;

            position: sticky;
            top: 0;
            z-index: 100;

            box-shadow: 0 2px 8px var(--shadow);
        }

        .back {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            flex-shrink: 0;

            border: none;
            border-radius: 10px;

            background: transparent;
            color: var(--header-text);

            font-size: 30px;
            line-height: 1;

            cursor: pointer;
        }

        .back:hover {
            background: #FFFFFF15;
        }

        .page-title {
            flex: 1;
            min-width: 0;

            font-size: clamp(22px, 5vw, 27px);
            font-weight: bold;

            overflow-wrap: anywhere;
        }

        /* =========================
           PAGE CONTENT
        ========================= */

        .page-content {
            width: 100%;
            max-width: 850px;

            margin: 0 auto;

            padding:
                18px
                18px
                calc(100px + env(safe-area-inset-bottom));
        }

        .intro {
            margin: 0 0 18px;

            color: var(--muted);

            font-size: 15px;
            line-height: 1.5;
        }

        /* =========================
           NOTIFICATION STATUS
        ========================= */

        .notification-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 13px 14px;
            margin-bottom: 20px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: var(--card);
        }

        .notification-info {
            min-width: 0;
            flex: 1;
        }

        .notification-heading {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .notification-description {
            font-size: 12px;
            line-height: 1.45;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .notification-button {
            flex-shrink: 0;

            border: none;
            border-radius: 9px;

            padding: 10px 12px;

            background: var(--accent);
            color: #FFFFFF;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;
        }

        .notification-button:hover {
            background: var(--accent-hover);
        }

        .notification-button:disabled {
            opacity: 0.65;
            cursor: default;
        }

        /* =========================
           REMINDER SECTIONS
        ========================= */

        .section-title {
            margin: 25px 0 12px;

            font-size: 19px;
            font-weight: bold;

            color: var(--text);
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .reminder-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* =========================
           REMINDER CARD
        ========================= */

        .reminder {
            display: flex;
            align-items: flex-start;

            gap: 12px;

            width: 100%;
            min-width: 0;

            padding: 16px;

            border: 1px solid var(--border);
            border-radius: 15px;

            background: var(--card);

            box-shadow: 0 3px 8px var(--shadow);

            transition:
                background-color 0.25s,
                border-color 0.25s,
                opacity 0.2s;
        }

        .reminder.completed {
            opacity: 0.65;
        }

        .reminder.completed .reminder-title {
            text-decoration: line-through;
        }

        .reminder-checkbox {
            appearance: auto;

            width: 23px;
            height: 23px;

            margin: 2px 0 0;

            flex-shrink: 0;

            accent-color: var(--accent);

            cursor: pointer;
        }

        .reminder-info {
            flex: 1;
            min-width: 0;
        }

        .reminder-title {
            color: var(--text);

            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;

            overflow-wrap: anywhere;
        }

        .reminder-date {
            margin-top: 7px;

            color: var(--muted);

            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;

            overflow-wrap: anywhere;
        }

        .reminder-note {
            margin-top: 8px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.5;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .reminder-actions {
            display: flex;
            align-items: center;

            gap: 3px;

            flex-shrink: 0;
        }

        .action-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 36px;
            height: 36px;

            padding: 0;

            border: none;
            border-radius: 9px;

            background: transparent;
            color: var(--accent);

            font-size: 20px;

            cursor: pointer;
        }

        .action-button:hover {
            background: var(--background);
        }

        .edit-button {
            font-size: 17px;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty {
            padding: 45px 18px;

            border: 1px dashed var(--border);
            border-radius: 15px;

            background: var(--card);

            text-align: center;

            color: var(--muted);

            font-size: 16px;
            line-height: 1.7;
        }

        .empty-icon {
            display: block;

            margin-bottom: 12px;

            color: var(--accent);

            font-size: 42px;
        }

        /* =========================
           ADD BUTTON
        ========================= */

        .add-button {
            position: fixed;

            right: max(20px, env(safe-area-inset-right));
            bottom: max(22px, env(safe-area-inset-bottom));

            z-index: 150;

            display: flex;
            align-items: center;
            justify-content: center;

            width: 60px;
            height: 60px;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: var(--accent);
            color: #FFFFFF;

            font-size: 38px;
            line-height: 1;

            box-shadow: 0 4px 12px #00000035;

            cursor: pointer;

            transition: transform 0.2s;
        }

        .add-button:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .add-button:active {
            transform: scale(0.96);
        }

        /* =========================
           EDITOR OVERLAY
        ========================= */

        .reminder-editor {
            position: fixed;
            inset: 0;

            z-index: 2000;

            display: none;
            flex-direction: column;

            width: 100%;
            height: 100%;
            height: 100dvh;

            background: var(--background);
            color: var(--text);

            overflow: hidden;
        }

        .reminder-editor.show {
            display: flex;
        }

        .editor-top {
            display: flex;
            align-items: center;

            gap: 10px;

            flex-shrink: 0;

            padding:
                max(10px, env(safe-area-inset-top))
                12px
                10px;

            background: var(--header);
            color: var(--header-text);

            box-shadow: 0 2px 8px var(--shadow);
        }

        .editor-back {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 40px;
            height: 42px;

            flex-shrink: 0;

            border: none;
            border-radius: 9px;

            background: transparent;
            color: var(--header-text);

            font-size: 29px;

            cursor: pointer;
        }

        .editor-back:hover {
            background: #FFFFFF15;
        }

        .editor-title {
            flex: 1;
            min-width: 0;

            font-size: clamp(18px, 4.5vw, 23px);
            font-weight: bold;

            overflow-wrap: anywhere;
        }

        .save-button {
            flex-shrink: 0;

            padding: 10px 15px;

            border: none;
            border-radius: 8px;

            background: var(--accent);
            color: #FFFFFF;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
        }

        .save-button:hover {
            background: var(--accent-hover);
        }

        /* =========================
           EDITOR FORM
        ========================= */

        .form {
            width: 100%;
            max-width: 700px;

            margin: 0 auto;

            padding:
                22px
                20px
                calc(30px + env(safe-area-inset-bottom));

            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .form-label {
            display: block;

            margin: 20px 0 8px;

            color: var(--text);

            font-size: 15px;
            font-weight: bold;
        }

        .form-label:first-child {
            margin-top: 0;
        }

        .form-input {
            display: block;

            width: 100%;
            min-width: 0;
            min-height: 48px;

            padding: 12px 13px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: var(--input-background);
            color: var(--text);

            font-size: 16px;

            outline: none;

            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
        }

        .form-input::placeholder {
            color: var(--muted);
            opacity: 0.8;
        }

        textarea.form-input {
            min-height: 125px;

            resize: vertical;

            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        /* =========================
           RESPONSIVE MOBILE LAYOUT
        ========================= */

        @media (max-width: 600px) {
            .topbar {
                min-height: 60px;
                padding-left: 12px;
                padding-right: 12px;
                gap: 8px;
            }

            .page-content {
                padding: 15px 12px calc(95px + env(safe-area-inset-bottom));
            }

            .intro {
                font-size: 14px;
            }

            .notification-panel {
                align-items: flex-start;
                padding: 12px;
                gap: 8px;
            }

            .notification-button {
                max-width: 125px;
                white-space: normal;
                line-height: 1.3;
            }

            .reminder {
                padding: 13px 10px;
                gap: 9px;
                border-radius: 12px;
            }

            .reminder-checkbox {
                width: 21px;
                height: 21px;
            }

            .reminder-title {
                font-size: 16px;
            }

            .reminder-date {
                font-size: 12px;
            }

            .reminder-note {
                font-size: 13px;
            }

            .reminder-actions {
                gap: 0;
            }

            .action-button {
                width: 31px;
                height: 34px;
                font-size: 19px;
            }

            .edit-button {
                font-size: 15px;
            }

            .add-button {
                width: 56px;
                height: 56px;
                right: 16px;
                bottom: max(17px, env(safe-area-inset-bottom));
            }

            .form {
                padding: 19px 15px calc(25px + env(safe-area-inset-bottom));
            }

            .editor-top {
                gap: 5px;
                padding-left: 8px;
                padding-right: 8px;
            }

            .editor-title {
                font-size: 18px;
            }

            .save-button {
                padding: 10px 12px;
            }
        }

        @media (max-width: 360px) {
            .page-content {
                padding-left: 9px;
                padding-right: 9px;
            }

            .reminder {
                gap: 7px;
                padding: 11px 8px;
            }

            .reminder-title {
                font-size: 15px;
            }

            .action-button {
                width: 28px;
            }

            .notification-panel {
                flex-direction: column;
            }

            .notification-button {
                max-width: none;
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <button
            class="back"
            type="button"
            aria-label="Go back to notes"
            onclick="goBack()"
        >&#8592;</button>

        <div class="page-title">Reminders</div>

    </header>


    <!-- MAIN CONTENT -->

    <main class="page-content">

        <p class="intro">
            Keep track of the things you need to remember.
        </p>


        <!-- NOTIFICATION SETTINGS -->

        <section
            class="notification-panel"
            aria-label="Reminder notification settings"
        >

            <div class="notification-info">

                <div class="notification-heading">
                    Reminder notifications
                </div>

                <div
                    class="notification-description"
                    id="notificationStatus"
                    aria-live="polite"
                >
                    Enable notifications to receive alerts while
                    Blank Space is open.
                </div>

            </div>

            <button
                class="notification-button"
                id="notificationButton"
                type="button"
                onclick="enableNotifications()"
            >
                Enable alerts
            </button>

        </section>


        <!-- UPCOMING REMINDERS -->

        <section>

            <h2 class="section-title">
                Upcoming
            </h2>

            <div
                class="reminder-list"
                id="upcomingReminders"
            ></div>

        </section>


        <!-- COMPLETED REMINDERS -->

        <section>

            <h2 class="section-title">
                Completed
            </h2>

            <div
                class="reminder-list"
                id="completedReminders"
            ></div>

        </section>

    </main>


    <!-- ADD REMINDER BUTTON -->

    <button
        class="add-button"
        type="button"
        aria-label="Create a new reminder"
        onclick="newReminder()"
    >+</button>


    <!-- REMINDER EDITOR -->

    <section
        class="reminder-editor"
        id="reminderEditor"
        aria-label="Reminder editor"
        aria-hidden="true"
    >

        <header class="editor-top">

            <button
                class="editor-back"
                type="button"
                aria-label="Close reminder editor"
                onclick="closeEditor()"
            >&#8592;</button>

            <div
                class="editor-title"
                id="editorTitle"
            >
                New Reminder
            </div>

            <button
                class="save-button"
                id="saveButton"
                type="button"
                onclick="saveReminder()"
            >
                Save
            </button>

        </header>


        <form
            class="form"
            id="reminderForm"
        >

            <label
                class="form-label"
                for="reminderTitle"
            >
                Reminder *
            </label>

            <input
                class="form-input"
                id="reminderTitle"
                type="text"
                maxlength="200"
                placeholder="What do you need to remember?"
                autocomplete="off"
                required
            >


            <label
                class="form-label"
                for="reminderDate"
            >
                Date *
            </label>

            <input
                class="form-input"
                id="reminderDate"
                type="date"
                required
            >


            <label
                class="form-label"
                for="reminderTime"
            >
                Time (optional)
            </label>

            <input
                class="form-input"
                id="reminderTime"
                type="time"
            >


            <label
                class="form-label"
                for="reminderNote"
            >
                Notes (optional)
            </label>

            <textarea
                class="form-input"
                id="reminderNote"
                maxlength="5000"
                placeholder="Add some details..."
            ></textarea>

        </form>

    </section>


    <script>
        "use strict";

        /* =========================
           DARK MODE

           Keep the same storage key
           used by the other pages.
        ========================= */

        function applySavedTheme() {
            const isDark =
                localStorage.getItem("darkMode") === "true";

            document.body.classList.toggle(
                "dark-mode",
                isDark
            );
        }

        applySavedTheme();


        window.addEventListener("storage", function (event) {
            if (event.key === "darkMode") {
                applySavedTheme();
            }
        });


        /* =========================
           SAFE LOCAL STORAGE
        ========================= */

        function readStoredReminders() {
            try {
                const stored =
                    localStorage.getItem("reminders");

                if (!stored) {
                    return [];
                }

                const parsed = JSON.parse(stored);

                if (!Array.isArray(parsed)) {
                    return [];
                }

                return parsed.filter(function (item) {
                    return item && typeof item === "object";
                });

            } catch (error) {
                console.error(
                    "Could not load reminders:",
                    error
                );

                return [];
            }
        }


        let reminders = readStoredReminders();

        let currentReminderId = null;

        let notificationTimer = null;

        let notifiedReminderIds = new Set();


        /* =========================
           DATA MIGRATION

           Give older reminders IDs so
           editing and deleting remain
           reliable.
        ========================= */

        function createId() {
            if (
                window.crypto &&
                typeof window.crypto.randomUUID === "function"
            ) {
                return window.crypto.randomUUID();
            }

            return (
                Date.now().toString(36) +
                Math.random().toString(36).slice(2)
            );
        }


        let dataNeedsSaving = false;

        reminders = reminders.map(function (reminder) {

            const normalized = {
                ...reminder
            };

            if (!normalized.id) {
                normalized.id = createId();
                dataNeedsSaving = true;
            }

            if (typeof normalized.title !== "string") {
                normalized.title = "";
                dataNeedsSaving = true;
            }

            if (typeof normalized.date !== "string") {
                normalized.date = "";
                dataNeedsSaving = true;
            }

            if (typeof normalized.time !== "string") {
                normalized.time = "";
                dataNeedsSaving = true;
            }

            if (typeof normalized.note !== "string") {
                normalized.note = "";
                dataNeedsSaving = true;
            }

            normalized.completed =
                normalized.completed === true;

            return normalized;
        });


        /* =========================
           SAVE DATA
        ========================= */

        function saveData() {
            try {
                localStorage.setItem(
                    "reminders",
                    JSON.stringify(reminders)
                );

                return true;

            } catch (error) {
                console.error(
                    "Could not save reminders:",
                    error
                );

                alert(
                    "Blank Space could not save this change. " +
                    "Check your browser storage and try again."
                );

                return false;
            }
        }


        if (dataNeedsSaving) {
            saveData();
        }


        /* =========================
           DELETE CONFIRMATION
        ========================= */

        function shouldConfirmDelete(message) {
            return (
                localStorage.getItem(
                    "deleteConfirmation"
                ) !== "false"
            )
                ? window.confirm(message)
                : true;
        }


        /* =========================
           DATE HELPERS

           Construct dates in local time
           rather than relying on UTC
           parsing of date-only strings.
        ========================= */

        function parseReminderDate(date, time) {
            if (!date) {
                return null;
            }

            const parts = date.split("-").map(Number);

            if (
                parts.length !== 3 ||
                parts.some(function (part) {
                    return !Number.isFinite(part);
                })
            ) {
                return null;
            }

            const year = parts[0];
            const month = parts[1];
            const day = parts[2];

            const selectedTime = time || "09:00";
            const timeParts =
                selectedTime.split(":").map(Number);

            if (
                timeParts.length < 2 ||
                !Number.isFinite(timeParts[0]) ||
                !Number.isFinite(timeParts[1])
            ) {
                return null;
            }

            const result = new Date(
                year,
                month - 1,
                day,
                timeParts[0],
                timeParts[1],
                0,
                0
            );

            if (
                result.getFullYear() !== year ||
                result.getMonth() !== month - 1 ||
                result.getDate() !== day
            ) {
                return null;
            }

            return result;
        }


        function formatReminderDate(date, time) {
            const parsedDate =
                parseReminderDate(date, time);

            if (!parsedDate) {
                return "Date not set";
            }

            let result =
                parsedDate.toLocaleDateString(
                    undefined,
                    {
                        weekday: "short",
                        month: "short",
                        day: "numeric",
                        year: "numeric"
                    }
                );

            if (time) {
                result += " \u2022 " +
                    parsedDate.toLocaleTimeString(
                        undefined,
                        {
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );
            }

            return result;
        }


        function sortReminders(a, b) {
            const dateA =
                parseReminderDate(a.date, a.time);

            const dateB =
                parseReminderDate(b.date, b.time);

            if (!dateA && !dateB) {
                return 0;
            }

            if (!dateA) {
                return 1;
            }

            if (!dateB) {
                return -1;
            }

            return dateA.getTime() - dateB.getTime();
        }


        /* =========================
           CREATE EMPTY MESSAGE
        ========================= */

        function createEmptyMessage(message) {
            const empty = document.createElement("div");

            empty.className = "empty";

            const icon = document.createElement("span");

            icon.className = "empty-icon";
            icon.textContent = "\u25CB";
            icon.setAttribute("aria-hidden", "true");

            const text = document.createElement("div");

            text.textContent = message;

            empty.appendChild(icon);
            empty.appendChild(text);

            return empty;
        }


        /* =========================
           CREATE REMINDER CARD
        ========================= */

        function createReminderCard(reminder) {

            const box = document.createElement("article");

            box.className = "reminder";

            if (reminder.completed) {
                box.classList.add("completed");
            }


            /* COMPLETION CHECKBOX */

            const checkbox = document.createElement("input");

            checkbox.type = "checkbox";
            checkbox.className = "reminder-checkbox";
            checkbox.checked = reminder.completed;

            checkbox.setAttribute(
                "aria-label",
                "Mark " + reminder.title + " as completed"
            );

            checkbox.addEventListener("change", function () {

                const existing = reminders.find(function (item) {
                    return item.id === reminder.id;
                });

                if (!existing) {
                    return;
                }

                const previousValue = existing.completed;

                existing.completed = checkbox.checked;

                if (!saveData()) {
                    existing.completed = previousValue;
                    checkbox.checked = previousValue;
                    return;
                }

                displayReminders();
            });


            /* REMINDER INFORMATION */

            const info = document.createElement("div");

            info.className = "reminder-info";


            const title = document.createElement("div");

            title.className = "reminder-title";
            title.textContent = reminder.title;

            info.appendChild(title);


            const date = document.createElement("div");

            date.className = "reminder-date";

            date.textContent = formatReminderDate(
                reminder.date,
                reminder.time
            );

            info.appendChild(date);


            if (reminder.note) {
                const note = document.createElement("div");

                note.className = "reminder-note";
                note.textContent = reminder.note;

                info.appendChild(note);
            }


            /* ACTION BUTTONS */

            const actions = document.createElement("div");

            actions.className = "reminder-actions";


            const editButton = document.createElement("button");

            editButton.type = "button";
            editButton.className =
                "action-button edit-button";

            editButton.textContent = "\u270E";

            editButton.setAttribute(
                "aria-label",
                "Edit " + reminder.title
            );

            editButton.title = "Edit reminder";

            editButton.addEventListener("click", function () {
                editReminder(reminder.id);
            });


            const deleteButton = document.createElement("button");

            deleteButton.type = "button";
            deleteButton.className = "action-button";

            deleteButton.textContent = "\u00D7";

            deleteButton.setAttribute(
                "aria-label",
                "Delete " + reminder.title
            );

            deleteButton.title = "Delete reminder";

            deleteButton.addEventListener("click", function () {
                deleteReminder(reminder.id);
            });


            actions.appendChild(editButton);
            actions.appendChild(deleteButton);


            box.appendChild(checkbox);
            box.appendChild(info);
            box.appendChild(actions);

            return box;
        }


        /* =========================
           DISPLAY REMINDERS
        ========================= */

        function displayReminders() {

            const upcomingContainer =
                document.getElementById("upcomingReminders");

            const completedContainer =
                document.getElementById("completedReminders");

            upcomingContainer.replaceChildren();
            completedContainer.replaceChildren();


            const upcoming = reminders
                .filter(function (reminder) {
                    return !reminder.completed;
                })
                .slice()
                .sort(sortReminders);


            const completed = reminders
                .filter(function (reminder) {
                    return reminder.completed;
                })
                .slice()
                .sort(sortReminders);


            if (upcoming.length === 0) {
                upcomingContainer.appendChild(
                    createEmptyMessage(
                        reminders.length === 0
                            ? "No reminders yet. Tap + to create your first reminder."
                            : "You're all caught up!"
                    )
                );

            } else {
                upcoming.forEach(function (reminder) {
                    upcomingContainer.appendChild(
                        createReminderCard(reminder)
                    );
                });
            }


            if (completed.length === 0) {
                completedContainer.appendChild(
                    createEmptyMessage(
                        "Completed reminders will appear here."
                    )
                );

            } else {
                completed.forEach(function (reminder) {
                    completedContainer.appendChild(
                        createReminderCard(reminder)
                    );
                });
            }
        }


        /* =========================
           OPEN NEW REMINDER
        ========================= */

        function newReminder() {

            currentReminderId = null;

            document.getElementById("reminderForm").reset();

            document.getElementById("editorTitle").textContent =
                "New Reminder";

            document.getElementById("saveButton").textContent =
                "Save";

            openEditor();

            document.getElementById("reminderTitle").focus();
        }


        /* =========================
           EDIT EXISTING REMINDER
        ========================= */

        function editReminder(id) {

            const reminder = reminders.find(function (item) {
                return item.id === id;
            });

            if (!reminder) {
                alert("This reminder could not be found.");
                return;
            }

            currentReminderId = id;

            document.getElementById("reminderTitle").value =
                reminder.title;

            document.getElementById("reminderDate").value =
                reminder.date;

            document.getElementById("reminderTime").value =
                reminder.time;

            document.getElementById("reminderNote").value =
                reminder.note;

            document.getElementById("editorTitle").textContent =
                "Edit Reminder";

            document.getElementById("saveButton").textContent =
                "Save";

            openEditor();

            document.getElementById("reminderTitle").focus();
        }


        /* =========================
           OPEN AND CLOSE EDITOR
        ========================= */

        function openEditor() {

            const editor =
                document.getElementById("reminderEditor");

            editor.classList.add("show");

            editor.setAttribute("aria-hidden", "false");

            document.body.style.overflow = "hidden";
        }


        function closeEditor() {

            const editor =
                document.getElementById("reminderEditor");

            editor.classList.remove("show");

            editor.setAttribute("aria-hidden", "true");

            document.body.style.overflow = "";
        }


        /* =========================
           SAVE REMINDER
        ========================= */

        function saveReminder() {

            const title =
                document.getElementById("reminderTitle")
                    .value.trim();

            const date =
                document.getElementById("reminderDate")
                    .value;

            const time =
                document.getElementById("reminderTime")
                    .value;

            const note =
                document.getElementById("reminderNote")
                    .value.trim();


            if (!title) {
                alert("Give your reminder a name first.");

                document.getElementById("reminderTitle").focus();

                return;
            }


            if (!date) {
                alert("Choose a date for your reminder.");

                document.getElementById("reminderDate").focus();

                return;
            }


            const parsedDate = parseReminderDate(date, time);

            if (!parsedDate) {
                alert("Please choose a valid date and time.");
                return;
            }


            const now = new Date();

            if (parsedDate.getTime() < now.getTime()) {
                const continueSaving = window.confirm(
                    "This reminder is in the past. Save it anyway?"
                );

                if (!continueSaving) {
                    return;
                }
            }


            if (currentReminderId !== null) {

                const index = reminders.findIndex(function (item) {
                    return item.id === currentReminderId;
                });

                if (index === -1) {
                    alert("This reminder could not be found.");
                    closeEditor();
                    return;
                }

                const previousReminder = reminders[index];

                const updatedReminder = {
                    ...previousReminder,

                    title: title,
                    date: date,
                    time: time,
                    note: note
                };

                reminders[index] = updatedReminder;

                if (!saveData()) {
                    reminders[index] = previousReminder;
                    return;
                }

                /*
                 * Allow an edited reminder to notify
                 * again at its newly selected time.
                 */

                notifiedReminderIds.delete(
                    updatedReminder.id
                );

            } else {

                const newItem = {
                    id: createId(),

                    title: title,
                    date: date,
                    time: time,
                    note: note,

                    completed: false
                };

                reminders.push(newItem);

                if (!saveData()) {

                    reminders = reminders.filter(function (item) {
                        return item.id !== newItem.id;
                    });

                    return;
                }
            }


            closeEditor();

            displayReminders();

            checkDueReminders();
        }


        /* =========================
           DELETE REMINDER
        ========================= */

        function deleteReminder(id) {

            const reminder = reminders.find(function (item) {
                return item.id === id;
            });

            if (!reminder) {
                return;
            }

            if (
                !shouldConfirmDelete(
                    'Delete "' + reminder.title + '"?'
                )
            ) {
                return;
            }


            const previousReminders = reminders;

            reminders = reminders.filter(function (item) {
                return item.id !== id;
            });


            if (!saveData()) {
                reminders = previousReminders;
                return;
            }


            notifiedReminderIds.delete(id);

            displayReminders();
        }


        /* =========================
           BROWSER NOTIFICATIONS
        ========================= */

        function updateNotificationStatus() {

            const status =
                document.getElementById("notificationStatus");

            const button =
                document.getElementById("notificationButton");


            if (!("Notification" in window)) {

                status.textContent =
                    "This browser does not support browser notifications.";

                button.textContent = "Unavailable";
                button.disabled = true;

                return;
            }


            if (Notification.permission === "granted") {

                status.textContent =
                    "Notifications are enabled. Alerts can appear while this page is running.";

                button.textContent = "Enabled";
                button.disabled = true;

                return;
            }


            if (Notification.permission === "denied") {

                status.textContent =
                    "Notifications are blocked. Check your browser or app notification settings to allow them.";

                button.textContent = "Blocked";
                button.disabled = true;

                return;
            }


            status.textContent =
                "Allow notifications to receive reminder alerts while Blank Space is running.";

            button.textContent = "Enable alerts";
            button.disabled = false;
        }


        async function enableNotifications() {

            if (!("Notification" in window)) {

                alert(
                    "Your current browser does not support notifications."
                );

                updateNotificationStatus();

                return;
            }


            if (Notification.permission === "granted") {
                updateNotificationStatus();
                checkDueReminders();
                return;
            }


            if (Notification.permission === "denied") {

                alert(
                    "Notifications are blocked. Open your browser " +
                    "or Blank Space app settings and allow notifications."
                );

                updateNotificationStatus();

                return;
            }


            try {

                const permission =
                    await Notification.requestPermission();

                updateNotificationStatus();

                if (permission === "granted") {
                    checkDueReminders();
                }

            } catch (error) {

                console.error(
                    "Could not request notification permission:",
                    error
                );

                alert(
                    "Notifications could not be enabled. " +
                    "Check your browser settings and try again."
                );
            }
        }


        /* =========================
           CHECK DUE REMINDERS

           Checks every 30 seconds while
           the page is running.

           Date-only reminders are set
           to notify at 9:00 AM locally.
        ========================= */

        function checkDueReminders() {

            if (
                !("Notification" in window) ||
                Notification.permission !== "granted"
            ) {
                return;
            }


            const now = Date.now();


            reminders.forEach(function (reminder) {

                if (reminder.completed) {
                    return;
                }

                if (notifiedReminderIds.has(reminder.id)) {
                    return;
                }


                const dueDate =
                    parseReminderDate(
                        reminder.date,
                        reminder.time
                    );

                if (!dueDate) {
                    return;
                }


                if (dueDate.getTime() > now) {
                    return;
                }


                /*
                 * Mark before displaying to prevent
                 * duplicate alerts if rendering runs again.
                 */

                notifiedReminderIds.add(reminder.id);


                try {

                    const notification = new Notification(
                        "Blank Space Reminder",
                        {
                            body: reminder.title,
                            tag: "blank-space-" + reminder.id,
                            icon: "icon-192.png"
                        }
                    );


                    notification.onclick = function () {

                        window.focus();

                        notification.close();
                    };


                } catch (error) {

                    console.error(
                        "Could not display reminder notification:",
                        error
                    );
                }

            });
        }


        function startNotificationChecks() {

            if (notificationTimer !== null) {
                clearInterval(notificationTimer);
            }

            checkDueReminders();

            notificationTimer = setInterval(
                checkDueReminders,
                30000
            );
        }


        /* =========================
           HANDLE STORAGE CHANGES

           Sync reminders and theme when
           another page in the same origin
           changes localStorage.
        ========================= */

        window.addEventListener("storage", function (event) {

            if (event.key === "darkMode") {
                applySavedTheme();
            }


            if (event.key === "reminders") {

                reminders = readStoredReminders();

                reminders = reminders.map(function (reminder) {

                    if (!reminder.id) {
                        reminder.id = createId();
                    }

                    return reminder;
                });

                displayReminders();
            }

        });


        /* =========================
           NAVIGATION
        ========================= */

        function goBack() {

            window.location.href = "notes.html";
        }


        /* =========================
           KEYBOARD AND FORM HANDLING
        ========================= */

        document.getElementById("reminderForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                saveReminder();
            });


        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {

                const editor =
                    document.getElementById("reminderEditor");

                if (editor.classList.contains("show")) {
                    closeEditor();
                }
            }
        });


        /* =========================
           INITIALIZE PAGE
        ========================= */

        updateNotificationStatus();

        displayReminders();

        startNotificationChecks();

    </script>

</body>
