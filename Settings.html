<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#B86F72" id="themeColor">
    <meta name="color-scheme" content="light">
    <title>Blank Space - Settings</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --background: #F4E8E6;
            --card: #FFF9F7;
            --accent: #B86F72;
            --text: #593A3B;
            --muted: #806B6B;
            --light-rose: #D9A6A6;
            --border: #D8C2C1;
            --shadow: #593A3B14;
            --toggle-track: #D8C2C1;
            --topbar: #593A3B;
            --topbar-text: #FFF9F7;
        }

        body.dark {
            color-scheme: dark;
            --background: #302A2B;
            --card: #403637;
            --accent: #D9A6A6;
            --text: #F4E8E6;
            --muted: #C5B1B0;
            --light-rose: #B86F72;
            --border: #5A494A;
            --shadow: #00000033;
            --toggle-track: #5A494A;
            --topbar: #292324;
            --topbar-text: #FFF9F7;
        }

        html {
            min-height: 100%;
            background: #F4E8E6;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
            transition: background-color 0.25s, color 0.25s;
        }

        body:not(.dark) {
            background-color: #F4E8E6;
            color: #593A3B;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* TOP BAR */

        .topbar {
            min-height: 62px;
            background: var(--topbar);
            color: var(--topbar-text);
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--topbar-text);
            font-size: 27px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .back:active {
            background: #FFFFFF20;
        }

        .page-title {
            font-size: 23px;
            font-weight: bold;
        }

        /* SETTINGS LAYOUT */

        .settings {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 32px;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--muted);
            margin: 23px 4px 9px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .section-title:first-child {
            margin-top: 5px;
        }

        .settings-card,
        .about-card {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 8px var(--shadow);
            transition:
                background-color 0.25s,
                border-color 0.25s,
                color 0.25s;
        }

        .setting {
            min-height: 68px;
            padding: 13px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .setting:last-child {
            border-bottom: none;
        }

        .setting-info {
            flex: 1;
            min-width: 0;
            padding-right: 4px;
        }

        .setting-name {
            color: var(--text);
            font-size: 16px;
            font-weight: bold;
            line-height: 1.35;
        }

        .setting-description {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }

        /* TOGGLE */

        .toggle {
            position: relative;
            width: 48px;
            height: 28px;
            flex-shrink: 0;
            display: inline-block;
            cursor: pointer;
        }

        .toggle input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: var(--toggle-track);
            border-radius: 30px;
            transition: background 0.2s;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 22px;
            height: 22px;
            left: 3px;
            top: 3px;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 1px 3px #00000025;
            transition: transform 0.2s;
        }

        .toggle input:checked + .slider {
            background: var(--accent);
        }

        .toggle input:checked + .slider::before {
            transform: translateX(20px);
        }

        .toggle input:focus-visible + .slider {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }

        /* ABOUT */

        .about-card {
            padding: 17px;
        }

        .about-name {
            color: var(--text);
            font-size: 20px;
            font-weight: bold;
        }

        .version {
            margin-top: 5px;
            color: var(--muted);
            font-size: 13px;
        }

        .about-description {
            margin-top: 12px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            .topbar {
                min-height: 58px;
                padding: 8px 12px;
                gap: 10px;
            }

            .page-title {
                font-size: 21px;
            }

            .settings {
                padding: 12px;
                padding-bottom: 26px;
            }

            .section-title {
                margin-top: 20px;
            }

            .setting {
                min-height: 64px;
                padding: 12px;
                gap: 9px;
            }

            .setting-name {
                font-size: 15px;
            }

            .setting-description {
                font-size: 12px;
            }

            .about-card {
                padding: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">
        <button
            class="back"
            type="button"
            onclick="goBack()"
            aria-label="Go back"
        >←</button>

        <div class="page-title">Settings</div>
    </header>

    <!-- SETTINGS -->

    <main class="settings">

        <div class="section-title">Appearance</div>

        <section class="settings-card">
            <div class="setting">
                <div class="setting-info">
                    <div class="setting-name">Dark Mode</div>
                    <div class="setting-description">
                        Use a darker color theme.
                    </div>
                </div>

                <label class="toggle">
                    <input
                        type="checkbox"
                        id="darkModeToggle"
                        aria-label="Dark Mode"
                        onchange="toggleDarkMode()"
                    >
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <div class="section-title">Reminders</div>

        <section class="settings-card">
            <div class="setting">
                <div class="setting-info">
                    <div class="setting-name">Notifications</div>
                    <div class="setting-description">
                        Enable or disable reminder notifications.
                    </div>
                </div>

                <label class="toggle">
                    <input
                        type="checkbox"
                        id="notificationsToggle"
                        aria-label="Notifications"
                        onchange="toggleNotifications()"
                    >
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <div class="section-title">General</div>

        <section class="settings-card">
            <div class="setting">
                <div class="setting-info">
                    <div class="setting-name">
                        Confirm Before Deleting
                    </div>
                    <div class="setting-description">
                        Ask before deleting notes, lists, or reminders.
                    </div>
                </div>

                <label class="toggle">
                    <input
                        type="checkbox"
                        id="deleteConfirmToggle"
                        aria-label="Confirm Before Deleting"
                        onchange="toggleDeleteConfirmation()"
                    >
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <div class="section-title">About</div>

        <section class="about-card">
            <div class="about-name">Blank Space</div>
            <div class="version">Version 1.0</div>
            <div class="about-description">
                A simple space for your notes, lists, and reminders.
            </div>
        </section>

    </main>

    <script>
        /* ELEMENTS */

        const darkModeToggle =
            document.getElementById("darkModeToggle");

        const notificationsToggle =
            document.getElementById("notificationsToggle");

        const deleteConfirmToggle =
            document.getElementById("deleteConfirmToggle");

        const themeColorMeta =
            document.getElementById("themeColor");

        /* THEME */

        function applyTheme(enabled) {
            document.body.classList.toggle("dark", enabled);

            document.documentElement.style.colorScheme =
                enabled ? "dark" : "light";

            document.querySelector('meta[name="color-scheme"]')
                .setAttribute(
                    "content",
                    enabled ? "dark" : "light"
                );

            themeColorMeta.setAttribute(
                "content",
                enabled ? "#292324" : "#B86F72"
            );
        }

        /* LOAD SAVED SETTINGS */

        function loadSettings() {
            let darkMode = false;

            try {
                darkMode =
                    localStorage.getItem("darkMode") === "true";

                notificationsToggle.checked =
                    localStorage.getItem("notifications") !== "false";

                deleteConfirmToggle.checked =
                    localStorage.getItem("deleteConfirmation") !== "false";
            } catch (error) {
                console.warn("Could not load saved settings.", error);

                notificationsToggle.checked = true;
                deleteConfirmToggle.checked = true;
            }

            darkModeToggle.checked = darkMode;
            applyTheme(darkMode);
        }

        /* DARK MODE */

        function toggleDarkMode() {
            const enabled = darkModeToggle.checked;

            applyTheme(enabled);

            try {
                localStorage.setItem(
                    "darkMode",
                    String(enabled)
                );
            } catch (error) {
                console.warn("Could not save the theme setting.", error);
            }
        }

        /* NOTIFICATIONS */

        function toggleNotifications() {
            const enabled = notificationsToggle.checked;

            try {
                localStorage.setItem(
                    "notifications",
                    String(enabled)
                );
            } catch (error) {
                console.warn(
                    "Could not save the notification setting.",
                    error
                );
            }
        }

        /* DELETE CONFIRMATION */

        function toggleDeleteConfirmation() {
            const enabled = deleteConfirmToggle.checked;

            try {
                localStorage.setItem(
                    "deleteConfirmation",
                    String(enabled)
                );
            } catch (error) {
                console.warn(
                    "Could not save the deletion setting.",
                    error
                );
            }
        }

        /* GO BACK */

        function goBack() {
            window.location.href = "notes.html";
        }

        /* START */

        loadSettings();
    </script>

</body>
</html>
