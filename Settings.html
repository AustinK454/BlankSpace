<!DOCTYPE html>
<html>

<head>

    <title>Blank Space - Settings</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F4E8E6;
            color: #593A3B;
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 70px;
            background: #593A3B;
            color: #FFF9F7;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }

        .back {
            font-size: 30px;
            cursor: pointer;
        }

        .page-title {
            font-size: 27px;
            font-weight: bold;
        }


        /* =========================
           SETTINGS
        ========================= */

        .settings {
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #806B6B;
            margin: 25px 5px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section-title:first-child {
            margin-top: 5px;
        }

        .settings-card {
            background: #FFF9F7;
            border: 1px solid #D8C2C1;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 8px #593A3B14;
        }

        .setting {
            min-height: 70px;
            padding: 15px 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #D8C2C1;
        }

        .setting:last-child {
            border-bottom: none;
        }

        .setting-info {
            flex: 1;
            padding-right: 15px;
        }

        .setting-name {
            font-size: 18px;
            font-weight: bold;
        }

        .setting-description {
            margin-top: 5px;
            color: #806B6B;
            font-size: 14px;
            line-height: 1.3;
        }


        /* =========================
           TOGGLE
        ========================= */

        .toggle {
            position: relative;
            width: 52px;
            height: 30px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #D8C2C1;
            border-radius: 30px;
            transition: 0.3s;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }

        .toggle input:checked + .slider {
            background: #B86F72;
        }

        .toggle input:checked + .slider::before {
            transform: translateX(22px);
        }


        /* =========================
           ABOUT
        ========================= */

        .about-card {
            background: #FFF9F7;
            border: 1px solid #D8C2C1;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 8px #593A3B14;
        }

        .about-name {
            font-size: 23px;
            font-weight: bold;
        }

        .version {
            margin-top: 5px;
            color: #806B6B;
            font-size: 15px;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark {
            background: #292627;
            color: #F4E8E6;
        }

        body.dark .section-title {
            color: #B8A5A3;
        }

        body.dark .settings-card,
        body.dark .about-card {
            background: #3A3030;
            border-color: #514344;
            box-shadow: 0 3px 8px #00000033;
        }

        body.dark .setting {
            border-color: #514344;
        }

        body.dark .setting-description,
        body.dark .version {
            color: #B8A5A3;
        }

        body.dark .slider {
            background: #514344;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .topbar {
                height: 65px;
            }

            .page-title {
                font-size: 24px;
            }

            .settings {
                padding: 15px;
            }

            .setting {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <div
        class="back"
        onclick="goBack()"
    >
        ←
    </div>

    <div class="page-title">
        Settings
    </div>

</div>


<!-- =========================
     SETTINGS
========================= -->

<div class="settings">


    <div class="section-title">
        Appearance
    </div>

    <div class="settings-card">

        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    Dark Mode
                </div>

                <div class="setting-description">
                    Use a darker color theme.
                </div>

            </div>

            <label class="toggle">

                <input
                    type="checkbox"
                    id="darkModeToggle"
                    onchange="toggleDarkMode()"
                >

                <span class="slider"></span>

            </label>

        </div>

    </div>


    <div class="section-title">
        Reminders
    </div>

    <div class="settings-card">

        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    Notifications
                </div>

                <div class="setting-description">
                    Allow Blank Space to send reminder notifications.
                </div>

            </div>

            <label class="toggle">

                <input
                    type="checkbox"
                    id="notificationsToggle"
                    onchange="toggleNotifications()"
                >

                <span class="slider"></span>

            </label>

        </div>

    </div>


    <div class="section-title">
        General
    </div>

    <div class="settings-card">

        <div class="setting">

            <div class="setting-info">

                <div class="setting-name">
                    Confirm Before Deleting
                </div>

                <div class="setting-description">
                    Ask before deleting notes, lists, or reminders.
                </div>

            </div>

            <label class="toggle">

                <input
                    type="checkbox"
                    id="deleteConfirmToggle"
                    onchange="toggleDeleteConfirmation()"
                >

                <span class="slider"></span>

            </label>

        </div>

    </div>


    <div class="section-title">
        About
    </div>

    <div class="about-card">

        <div class="about-name">
            Blank Space
        </div>

        <div class="version">
            Version 1.0
        </div>

    </div>


</div>


<script>


    /* =========================
       LOAD SETTINGS
    ========================= */

    const darkMode =
        localStorage.getItem("darkMode") === "true";

    const notifications =
        localStorage.getItem("notifications") !== "false";

    const deleteConfirmation =
        localStorage.getItem("deleteConfirmation") !== "false";


    document.getElementById(
        "darkModeToggle"
    ).checked =
        darkMode;


    document.getElementById(
        "notificationsToggle"
    ).checked =
        notifications;


    document.getElementById(
        "deleteConfirmToggle"
    ).checked =
        deleteConfirmation;


    if (darkMode) {

        document.body.classList.add("dark");

    }


    /* =========================
       DARK MODE
    ========================= */

    function toggleDarkMode() {

        const enabled =
            document.getElementById(
                "darkModeToggle"
            ).checked;


        localStorage.setItem(
            "darkMode",
            enabled
        );


        document.body.classList.toggle(
            "dark",
            enabled
        );

    }


    /* =========================
       NOTIFICATIONS
    ========================= */

    function toggleNotifications() {

        const enabled =
            document.getElementById(
                "notificationsToggle"
            ).checked;


        localStorage.setItem(
            "notifications",
            enabled
        );

    }


    /* =========================
       DELETE CONFIRMATION
    ========================= */

    function toggleDeleteConfirmation() {

        const enabled =
            document.getElementById(
                "deleteConfirmToggle"
            ).checked;


        localStorage.setItem(
            "deleteConfirmation",
            enabled
        );

    }


    /* =========================
       GO BACK
    ========================= */

    function goBack() {

        window.location.href =
            "notes.html";

    }


</script>


</body>
</html>
