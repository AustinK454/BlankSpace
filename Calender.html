<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#593A3B">

    <title>Blank Space - Calendar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --page: #F4E8E6;
            --card: #FFF9F7;
            --text: #593A3B;
            --muted: #806B6B;
            --accent: #B86F72;
            --border: #D8C2C1;
            --hover: #F9EFED;
            --today: #E5C0BE;
            --header-text: #FFF9F7;
            --input-text: #593A3B;
        }

        body.dark {
            color-scheme: dark;
            --page: #292627;
            --card: #3A3030;
            --text: #F4E8E6;
            --muted: #C4AEAC;
            --accent: #C98286;
            --border: #514344;
            --hover: #463838;
            --today: #5A4142;
            --header-text: #FFF9F7;
            --input-text: #F4E8E6;
        }

        html {
            min-height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--page);
            color: var(--text);
            font-family: Arial, sans-serif;
            transition: background 0.25s, color 0.25s;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .topbar {
            min-height: 65px;
            background: #593A3B;
            color: #FFF9F7;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            gap: 16px;
            box-shadow: 0 4px 12px #00000018;
        }

        .back {
            border: none;
            background: transparent;
            color: #FFF9F7;
            font-size: 30px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            flex: 1;
        }

        .year-section {
            text-align: center;
            padding: 18px 12px 8px;
        }

        #year {
            font-size: 24px;
            font-weight: bold;
            color: var(--text);
        }

        .calendar-subtitle {
            margin-top: 5px;
            font-size: 12px;
            color: var(--accent);
        }

        .month-navigation {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 8px 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .month-navigation button,
        .today-button {
            border: none;
            background: var(--accent);
            color: #FFF9F7;
            cursor: pointer;
            touch-action: manipulation;
        }

        .month-arrow {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 10px;
            font-size: 25px;
            font-weight: bold;
        }

        .month-navigation button:active,
        .today-button:active {
            transform: scale(0.96);
        }

        .month-display {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .month-display-name {
            font-size: 25px;
            font-weight: bold;
            color: var(--text);
        }

        .month-display-year {
            margin-top: 3px;
            font-size: 12px;
            color: var(--accent);
        }

        .today-container {
            text-align: center;
            margin-bottom: 18px;
        }

        .today-button {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .month {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 40px;
            padding: 0 12px;
        }

        .month-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            margin-bottom: 12px;
            color: var(--text);
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .month-title::before {
            content: "";
            width: 6px;
            height: 28px;
            flex-shrink: 0;
            background: var(--accent);
            border-radius: 5px;
        }

        .month-title::after {
            content: "✦";
            font-size: 13px;
            color: var(--accent);
        }

        .calendar-box {
            width: 100%;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px #00000010;
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .weekdays {
            background: #593A3B;
            color: #FFF9F7;
        }

        .weekday {
            min-width: 0;
            text-align: center;
            padding: 10px 0;
            font-size: 12px;
            font-weight: bold;
            border-right: 1px solid #806B6B;
        }

        .weekday:last-child {
            border-right: none;
        }

        .day {
            min-width: 0;
            min-height: 100px;
            padding: 5px;
            background: var(--card);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .day:nth-child(7n) {
            border-right: none;
        }

        .day:hover {
            background: var(--hover);
        }

        .day-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 25px;
            height: 25px;
            margin-bottom: 4px;
            border-radius: 50%;
            color: var(--text);
            font-size: 13px;
            font-weight: bold;
        }

        .day textarea {
            display: block;
            width: 100%;
            height: 55px;
            min-width: 0;
            padding: 2px;
            border: none;
            border-radius: 4px;
            outline: none;
            resize: none;
            background: transparent;
            color: var(--input-text);
            font-family: Arial, sans-serif;
            font-size: 12px;
            line-height: 17px;
            overflow-wrap: anywhere;
            overflow-x: hidden;
        }

        .day textarea:focus {
            background: var(--hover);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .day textarea::placeholder {
            color: var(--muted);
            opacity: 0.8;
        }

        .clear-day {
            display: block;
            margin-top: 3px;
            padding: 3px 0;
            border: none;
            background: transparent;
            color: var(--accent);
            font-size: 10px;
            cursor: pointer;
        }

        .empty {
            min-width: 0;
            min-height: 100px;
            background: var(--page);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .empty:nth-child(7n) {
            border-right: none;
        }

        .today {
            background: var(--today);
            box-shadow: inset 0 0 0 2px var(--accent);
        }

        .today .day-number {
            background: var(--accent);
            color: #FFF9F7;
        }

        body.dark .calendar-box {
            box-shadow: 0 5px 18px #00000030;
        }

        body.dark .today {
            background: #5A4142;
        }

        body.dark .day textarea {
            color: #F4E8E6;
        }

        body.dark .today-button {
            background: var(--accent);
        }

        @media (max-width: 600px) {
            .topbar {
                min-height: 58px;
                padding: 8px 13px;
                gap: 12px;
            }

            .back {
                font-size: 27px;
            }

            .page-title {
                font-size: 21px;
            }

            .year-section {
                padding-top: 14px;
            }

            #year {
                font-size: 21px;
            }

            .month-navigation {
                gap: 7px;
                padding: 7px 10px 14px;
            }

            .month-arrow {
                width: 35px;
                height: 37px;
                font-size: 22px;
            }

            .month-display-name {
                font-size: 21px;
            }

            .month-display-year {
                font-size: 11px;
            }

            .month {
                padding: 0 5px;
                margin-bottom: 25px;
            }

            .month-title {
                font-size: 24px;
                margin-left: 5px;
            }

            .calendar-box {
                border-radius: 9px;
            }

            .weekday {
                padding: 9px 0;
                font-size: 10px;
            }

            .day {
                min-height: 78px;
                padding: 3px;
            }

            .empty {
                min-height: 78px;
            }

            .day-number {
                min-width: 21px;
                height: 21px;
                font-size: 11px;
                margin-bottom: 3px;
            }

            .day textarea {
                height: 43px;
                padding: 1px;
                font-size: 10px;
                line-height: 14px;
            }

            .clear-day {
                margin-top: 2px;
                font-size: 9px;
            }
        }

        @media (max-width: 360px) {
            .month-navigation {
                gap: 5px;
                padding-left: 6px;
                padding-right: 6px;
            }

            .month-arrow {
                width: 31px;
                height: 34px;
            }

            .month-display-name {
                font-size: 18px;
            }

            .month {
                padding: 0 3px;
            }

            .weekday {
                font-size: 9px;
            }

            .day {
                min-height: 69px;
                padding: 2px;
            }

            .empty {
                min-height: 69px;
            }

            .day-number {
                min-width: 19px;
                height: 19px;
                font-size: 10px;
            }

            .day textarea {
                height: 38px;
                font-size: 9px;
                line-height: 12px;
            }

            .clear-day {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <button class="back" onclick="goBack()" aria-label="Go back">←</button>
        <div class="page-title">CALENDAR</div>
    </div>

    <div class="year-section">
        <div id="year"></div>
        <div class="calendar-subtitle">Your space to plan and reflect</div>
    </div>

    <div class="month-navigation">
        <button class="month-arrow" onclick="previousMonth()" aria-label="Previous month">‹</button>

        <div class="month-display">
            <div id="monthDisplayName" class="month-display-name"></div>
            <div id="monthDisplayYear" class="month-display-year"></div>
        </div>

        <button class="month-arrow" onclick="nextMonth()" aria-label="Next month">›</button>
    </div>

    <div class="today-container">
        <button class="today-button" onclick="goToToday()">Today</button>
    </div>

    <div id="calendar"></div>

    <script>
        // Load the app's saved theme.
        function applyTheme() {
            document.body.classList.toggle(
                "dark",
                localStorage.getItem("darkMode") === "true"
            );
        }

        applyTheme();

        // Keep the theme updated if another open page changes it.
        window.addEventListener("storage", function(event) {
            if (event.key === "darkMode") {
                applyTheme();
            }
        });

        function shouldConfirmDelete(message) {
            return localStorage.getItem("deleteConfirmation") === "false"
                || confirm(message);
        }

        function goBack() {
            window.location.href = "notes.html";
        }

        const calendar = document.getElementById("calendar");

        const months = [
            "January", "February", "March", "April",
            "May", "June", "July", "August",
            "September", "October", "November", "December"
        ];

        const weekdays = [
            "Sunday", "Monday", "Tuesday", "Wednesday",
            "Thursday", "Friday", "Saturday"
        ];

        let displayedMonth = new Date().getMonth();
        let displayedYear = new Date().getFullYear();

        function previousMonth() {
            displayedMonth--;

            if (displayedMonth < 0) {
                displayedMonth = 11;
                displayedYear--;
            }

            renderCalendar();
        }

        function nextMonth() {
            displayedMonth++;

            if (displayedMonth > 11) {
                displayedMonth = 0;
                displayedYear++;
            }

            renderCalendar();
        }

        function goToToday() {
            const today = new Date();
            displayedMonth = today.getMonth();
            displayedYear = today.getFullYear();
            renderCalendar();
        }

        function renderCalendar() {
            calendar.innerHTML = "";

            document.getElementById("year").textContent = displayedYear;
            document.getElementById("monthDisplayName").textContent =
                months[displayedMonth];
            document.getElementById("monthDisplayYear").textContent =
                displayedYear;

            const monthContainer = document.createElement("div");
            monthContainer.className = "month";

            const title = document.createElement("div");
            title.className = "month-title";
            title.textContent = months[displayedMonth];

            const calendarBox = document.createElement("div");
            calendarBox.className = "calendar-box";

            const weekdayRow = document.createElement("div");
            weekdayRow.className = "weekdays";

            weekdays.forEach(function(day) {
                const weekday = document.createElement("div");
                weekday.className = "weekday";
                weekday.textContent = day.substring(0, 3);
                weekdayRow.appendChild(weekday);
            });

            calendarBox.appendChild(weekdayRow);

            const days = document.createElement("div");
            days.className = "days";

            const firstDay = new Date(
                displayedYear, displayedMonth, 1
            ).getDay();

            const numberOfDays = new Date(
                displayedYear, displayedMonth + 1, 0
            ).getDate();

            for (let blank = 0; blank < firstDay; blank++) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.setAttribute("aria-hidden", "true");
                days.appendChild(empty);
            }

            for (let day = 1; day <= numberOfDays; day++) {
                const dayBox = document.createElement("div");
                dayBox.className = "day";

                const today = new Date();

                if (
                    displayedYear === today.getFullYear() &&
                    displayedMonth === today.getMonth() &&
                    day === today.getDate()
                ) {
                    dayBox.classList.add("today");
                }

                const number = document.createElement("div");
                number.className = "day-number";
                number.textContent = day;

                const note = document.createElement("textarea");
                note.placeholder = "Write...";
                note.setAttribute(
                    "aria-label",
                    "Note for " + months[displayedMonth] + " " +
                    day + ", " + displayedYear
                );
                note.maxLength = 2000;

                const storageKey =
                    "calendar-" + displayedYear + "-" +
                    displayedMonth + "-" + day;

                try {
                    note.value = localStorage.getItem(storageKey) || "";
                } catch (error) {
                    console.error("Could not load calendar note:", error);
                }

                note.addEventListener("input", function() {
                    try {
                        if (note.value === "") {
                            localStorage.removeItem(storageKey);
                        } else {
                            localStorage.setItem(storageKey, note.value);
                        }
                    } catch (error) {
                        alert("Could not save this note. Your device storage may be full.");
                    }
                });

                const clearButton = document.createElement("button");
                clearButton.className = "clear-day";
                clearButton.textContent = "Clear";
                clearButton.setAttribute(
                    "aria-label",
                    "Clear note for " + months[displayedMonth] + " " + day
                );

                clearButton.addEventListener("click", function() {
                    if (!note.value) {
                        return;
                    }

                    if (shouldConfirmDelete("Clear this day's note?")) {
                        note.value = "";
                        localStorage.removeItem(storageKey);
                    }
                });

                dayBox.appendChild(number);
                dayBox.appendChild(note);
                dayBox.appendChild(clearButton);
                days.appendChild(dayBox);
            }

            calendarBox.appendChild(days);
            monthContainer.appendChild(title);
            monthContainer.appendChild(calendarBox);
            calendar.appendChild(monthContainer);
        }

        renderCalendar();
    </script>

</body>
</html>
