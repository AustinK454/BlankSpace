<!DOCTYPE html>
<html>

<head>

    <title>Blank Space - Calendar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #F4E8E6;
            color: #593A3B;
            font-family: Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }


        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 70px;
            background: #593A3B;
            color: #FFF9F7;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            box-shadow: 0 4px 12px #593A3B20;
        }

        .back {
            font-size: 30px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .back:active {
            transform: scale(0.9);
        }

        .page-title {
            font-size: 27px;
            font-weight: bold;
            flex: 1;
            letter-spacing: 0.5px;
        }


        /* =========================
           YEAR / INTRO
        ========================= */

        .year-section {
            text-align: center;
            padding: 20px 20px 10px;
        }

        #year {
            font-size: 25px;
            font-weight: bold;
            color: #593A3B;
        }

        .calendar-subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: #B86F72;
            font-style: italic;
        }


        /* =========================
           MONTH NAVIGATION
        ========================= */

        .month-navigation {
            max-width: 900px;
            margin: 0 auto;
            padding: 5px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .month-navigation button {
            border: none;
            background: #B86F72;
            color: #FFF9F7;
            cursor: pointer;
            transition:
                transform 0.15s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .month-navigation button:active {
            transform: scale(0.92);
        }

        .month-arrow {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 3px 8px #593A3B20;
        }

        .month-arrow:hover {
            background: #A96165;
        }

        .month-navigation button.today-button {
            padding: 9px 17px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            background: #593A3B;
            box-shadow: 0 3px 8px #593A3B20;
        }

        .month-navigation button.today-button:hover {
            background: #6B4849;
        }

        .month-display {
            min-width: 190px;
            text-align: center;
        }

        .month-display-name {
            font-size: 27px;
            font-weight: bold;
            color: #593A3B;
        }

        .month-display-year {
            font-size: 13px;
            color: #B86F72;
            margin-top: 2px;
        }


        /* =========================
           MONTH
        ========================= */

        .month {
            max-width: 900px;
            margin: 0 auto 55px;
            padding: 0 20px;
        }

        .month-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 34px;
            margin-bottom: 14px;
            color: #593A3B;
            font-weight: bold;
            letter-spacing: -0.5px;
        }

        .month-title::before {
            content: "";
            width: 7px;
            height: 34px;
            background: #B86F72;
            border-radius: 5px;
        }

        .month-title::after {
            content: "✦";
            font-size: 14px;
            color: #B86F72;
            opacity: 0.7;
            margin-left: 2px;
        }


        /* =========================
           CALENDAR BOX
        ========================= */

        .calendar-box {
            background: #FFF9F7;
            color: #593A3B;
            border: 2px solid #B86F72;
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 8px 20px #593A3B18,
                0 2px 4px #593A3B10;
            position: relative;
        }

        .calendar-box::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;
            background: #B86F72;
            opacity: 0.35;
        }


        /* =========================
           WEEKDAYS
        ========================= */

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #593A3B;
            color: #FFF9F7;
        }

        .weekday {
            text-align: center;
            padding: 11px 4px;
            font-weight: bold;
            font-size: 13px;
            border-right: 1px solid #806B6B;
        }

        .weekday:last-child {
            border-right: none;
        }


        /* =========================
           DAYS
        ========================= */

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .day {
            min-height: 110px;
            padding: 9px;
            border-right: 1px solid #D8C2C1;
            border-bottom: 1px solid #D8C2C1;
            cursor: text;
            transition:
                background 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.15s ease;
            position: relative;
        }

        .day:hover {
            background: #F9EFED;
            box-shadow: inset 0 0 0 2px #B86F7225;
        }

        .day:active {
            transform: scale(0.995);
        }

        .day-number {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            color: #593A3B;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 27px;
            height: 27px;
            border-radius: 50%;
        }

        .day textarea {
            width: 100%;
            height: 70px;
            border: none;
            outline: none;
            resize: none;
            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 20px,
                    #B86F7220 21px,
                    transparent 22px
                );
            color: #B86F72;
            font-family: Arial, sans-serif;
            font-size: 13px;
            padding: 0;
            font-weight: bold;
            line-height: 21px;
        }

        .day textarea::placeholder {
            color: #B8A2A2;
            font-weight: normal;
        }

        .day textarea:focus {
            color: #593A3B;
        }


        /* =========================
           CLEAR BUTTON
        ========================= */

        .clear-day {
            margin-top: 5px;
            border: none;
            background: transparent;
            color: #B86F72;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 0;
            transition: opacity 0.2s ease;
        }

        .clear-day:hover {
            text-decoration: underline;
        }

        .clear-day:active {
            opacity: 0.5;
        }


        /* =========================
           EMPTY DAYS
        ========================= */

        .empty {
            min-height: 110px;
            border-right: 1px solid #D8C2C1;
            border-bottom: 1px solid #D8C2C1;
            background: #F9EFED;
        }


        /* =========================
           TODAY
        ========================= */

        .today {
            background: #E5C0BE;
            box-shadow: inset 0 0 0 2px #B86F72;
        }

        .today .day-number {
            background: #B86F72;
            color: #FFF9F7;
            box-shadow: 0 2px 5px #593A3B25;
        }


        /* =========================
           DARK MODE
        ========================= */

        body.dark {
            background: #292627;
            color: #F4E8E6;
        }

        body.dark #year {
            color: #F4E8E6;
        }

        body.dark .calendar-subtitle {
            color: #D9A6A6;
        }

        body.dark .month-title {
            color: #F4E8E6;
        }

        body.dark .month-display-name {
            color: #F4E8E6;
        }

        body.dark .month-display-year {
            color: #D9A6A6;
        }

        body.dark .calendar-box {
            background: #3A3030;
            color: #F4E8E6;
            border-color: #B86F72;
        }

        body.dark .day {
            background: #3A3030;
            border-color: #514344;
        }

        body.dark .day:hover {
            background: #403535;
        }

        body.dark .day-number {
            color: #F4E8E6;
        }

        body.dark .day textarea {
            color: #F4E8E6;
            background:
                repeating-linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 20px,
                    #B86F7230 21px,
                    transparent 22px
                );
        }

        body.dark .day textarea:focus {
            color: #F4E8E6;
        }

        body.dark .day textarea::placeholder {
            color: #8F7D7C;
        }

        body.dark .empty {
            background: #292627;
            border-color: #514344;
        }

        body.dark .clear-day {
            color: #B86F72;
        }

        body.dark .today {
            background: #5A4142;
            box-shadow: inset 0 0 0 2px #B86F72;
        }

        body.dark .today .day-number {
            background: #B86F72;
            color: #FFF9F7;
        }

        body.dark .month-navigation button.today-button {
            background: #B86F72;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .topbar {
                height: 65px;
            }

            .page-title {
                font-size: 24px;
            }

            .year-section {
                padding: 17px 15px 5px;
            }

            #year {
                font-size: 21px;
            }

            .calendar-subtitle {
                font-size: 11px;
            }

            .month-navigation {
                padding: 5px 12px 17px;
                gap: 7px;
            }

            .month-arrow {
                width: 38px;
                height: 38px;
                border-radius: 10px;
                font-size: 22px;
            }

            .month-display {
                min-width: 145px;
            }

            .month-display-name {
                font-size: 23px;
            }

            .month-display-year {
                font-size: 11px;
            }

            .month-navigation button.today-button {
                padding: 8px 12px;
                font-size: 10px;
            }

            .month {
                padding: 0 12px;
                margin-bottom: 40px;
            }

            .month-title {
                font-size: 27px;
            }

            .month-title::before {
                height: 27px;
                width: 6px;
            }

            .month-title::after {
                font-size: 12px;
            }

            .weekday {
                font-size: 10px;
                padding: 9px 2px;
            }

            .day {
                min-height: 85px;
                padding: 5px;
            }

            .empty {
                min-height: 85px;
            }

            .day-number {
                font-size: 13px;
                min-width: 23px;
                height: 23px;
            }

            .day textarea {
                height: 55px;
                font-size: 10px;
                line-height: 18px;
                background:
                    repeating-linear-gradient(
                        to bottom,
                        transparent 0,
                        transparent 17px,
                        #B86F7220 18px,
                        transparent 19px
                    );
            }

            .clear-day {
                font-size: 9px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <div
        class="back"
        onclick="goBack()"
    >
        ←
    </div>

    <div class="page-title">
        CALENDAR
    </div>

</div>


<!-- =========================
     YEAR
========================= -->

<div class="year-section">

    <div id="year"></div>

    <div class="calendar-subtitle">
    </div>

</div>


<!-- =========================
     MONTH NAVIGATION
========================= -->

<div class="month-navigation">

    <button
        class="month-arrow"
        onclick="previousMonth()"
    >
        ‹
    </button>

    <div class="month-display">

        <div
            id="monthDisplayName"
            class="month-display-name"
        ></div>

        <div
            id="monthDisplayYear"
            class="month-display-year"
        ></div>

    </div>

    <button
        class="month-arrow"
        onclick="nextMonth()"
    >
        ›
    </button>

</div>


<div style="text-align:center; margin-bottom:20px;">

    <button
        class="today-button"
        onclick="goToToday()"
        style="
            border:none;
            background:#593A3B;
            color:#FFF9F7;
            padding:9px 17px;
            border-radius:10px;
            font-size:12px;
            font-weight:bold;
            cursor:pointer;
        "
    >
        Today
    </button>

</div>


<!-- =========================
     CALENDAR
========================= -->

<div id="calendar"></div>


<script>


    /* =========================
       LOAD DARK MODE
    ========================= */

    if (
        localStorage.getItem("darkMode") === "true"
    ) {

        document.body.classList.add("dark");

    }


    /* =========================
       DELETE CONFIRMATION
    ========================= */

    function shouldConfirmDelete(message) {

        return localStorage.getItem(
            "deleteConfirmation"
        ) !== "false"

            ? confirm(message)

            : true;

    }


    /* =========================
       BACK TO NOTES
    ========================= */

    function goBack() {

        window.location.href =
            "notes.html";

    }


    /* =========================
       CALENDAR DATA
    ========================= */

    const calendar =
        document.getElementById(
            "calendar"
        );


    const months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];


    const weekdays = [

        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"

    ];


    /* =========================
       CURRENT DATE
    ========================= */

    const currentDate =
        new Date();


    let displayedMonth =
        currentDate.getMonth();


    let displayedYear =
        currentDate.getFullYear();


    document.getElementById(
        "year"
    ).textContent =
        displayedYear;


    /* =========================
       PREVIOUS MONTH
    ========================= */

    function previousMonth() {

        displayedMonth--;

        if (displayedMonth < 0) {

            displayedMonth = 11;

            displayedYear--;

        }

        renderCalendar();

    }


    /* =========================
       NEXT MONTH
    ========================= */

    function nextMonth() {

        displayedMonth++;

        if (displayedMonth > 11) {

            displayedMonth = 0;

            displayedYear++;

        }

        renderCalendar();

    }


    /* =========================
       GO TO TODAY
    ========================= */

    function goToToday() {

        displayedMonth =
            currentDate.getMonth();

        displayedYear =
            currentDate.getFullYear();

        renderCalendar();

    }


    /* =========================
       RENDER CALENDAR
    ========================= */

    function renderCalendar() {

        calendar.innerHTML = "";


        document.getElementById(
            "year"
        ).textContent =
            displayedYear;


        document.getElementById(
            "monthDisplayName"
        ).textContent =
            months[displayedMonth];


        document.getElementById(
            "monthDisplayYear"
        ).textContent =
            displayedYear;


        const monthContainer =
            document.createElement(
                "div"
            );

        monthContainer.className =
            "month";


        /* =========================
           MONTH NAME
        ========================= */

        const title =
            document.createElement(
                "div"
            );

        title.className =
            "month-title";

        title.textContent =
            months[displayedMonth];


        monthContainer.appendChild(
            title
        );


        /* =========================
           CALENDAR BOX
        ========================= */

        const calendarBox =
            document.createElement(
                "div"
            );

        calendarBox.className =
            "calendar-box";


        /* =========================
           WEEKDAYS
        ========================= */

        const weekdayRow =
            document.createElement(
                "div"
            );

        weekdayRow.className =
            "weekdays";


        weekdays.forEach(
            function(day) {

                const weekday =
                    document.createElement(
                        "div"
                    );

                weekday.className =
                    "weekday";

                weekday.textContent =
                    day.substring(0, 3);

                weekdayRow.appendChild(
                    weekday
                );

            }
        );


        calendarBox.appendChild(
            weekdayRow
        );


        /* =========================
           DAYS
        ========================= */

        const days =
            document.createElement(
                "div"
            );

        days.className =
            "days";


        const firstDay =
            new Date(
                displayedYear,
                displayedMonth,
                1
            ).getDay();


        const numberOfDays =
            new Date(
                displayedYear,
                displayedMonth + 1,
                0
            ).getDate();


        /* =========================
           EMPTY DAYS
        ========================= */

        for (
            let blank = 0;
            blank < firstDay;
            blank++
        ) {

            const empty =
                document.createElement(
                    "div"
                );

            empty.className =
                "empty";

            days.appendChild(
                empty
            );

        }


        /* =========================
           ACTUAL DAYS
        ========================= */

        for (
            let day = 1;
            day <= numberOfDays;
            day++
        ) {

            const dayBox =
                document.createElement(
                    "div"
                );

            dayBox.className =
                "day";


            /* =========================
               CHECK TODAY
            ========================= */

            if (
                displayedYear ===
                    currentDate.getFullYear() &&

                displayedMonth ===
                    currentDate.getMonth() &&

                day ===
                    currentDate.getDate()
            ) {

                dayBox.classList.add(
                    "today"
                );

            }


            /* =========================
               DAY NUMBER
            ========================= */

            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "day-number";

            number.textContent =
                day;


            /* =========================
               TEXT AREA
            ========================= */

            const note =
                document.createElement(
                    "textarea"
                );

            note.placeholder =
                "Write...";


            /* =========================
               SAVE KEY
            ========================= */

            const storageKey =
                "calendar-" +
                displayedYear +
                "-" +
                displayedMonth +
                "-" +
                day;


            /* =========================
               LOAD SAVED NOTE
            ========================= */

            const saved =
                localStorage.getItem(
                    storageKey
                );


            if (saved) {

                note.value =
                    saved;

            }


            /* =========================
               SAVE WHEN TYPING
            ========================= */

            note.addEventListener(
                "input",
                function() {

                    localStorage.setItem(
                        storageKey,
                        note.value
                    );

                }
            );


            /* =========================
               CLEAR BUTTON
            ========================= */

            const clearButton =
                document.createElement(
                    "button"
                );

            clearButton.className =
                "clear-day";

            clearButton.textContent =
                "Clear";


            clearButton.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();


                    if (
                        note.value === "" &&
                        !localStorage.getItem(
                            storageKey
                        )
                    ) {

                        return;

                    }


                    if (
                        shouldConfirmDelete(
                            "Clear this day's note?"
                        )
                    ) {

                        note.value = "";

                        localStorage.removeItem(
                            storageKey
                        );

                    }

                }
            );


            /* =========================
               PUT EVERYTHING TOGETHER
            ========================= */

            dayBox.appendChild(
                number
            );

            dayBox.appendChild(
                note
            );

            dayBox.appendChild(
                clearButton
            );

            days.appendChild(
                dayBox
            );

        }


        calendarBox.appendChild(
            days
        );

        monthContainer.appendChild(
            calendarBox
        );

        calendar.appendChild(
            monthContainer
        );

    }


    /* =========================
       START CALENDAR
    ========================= */

    renderCalendar();


</script>


</body>

</html>
